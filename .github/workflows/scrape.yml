name: Scrape menus

on:
  schedule:
    # 09:00 Europe/Prague Mon-Fri.
    # GitHub cron is UTC. 07:00 UTC = 09:00 CEST (summer) / 08:00 CET (winter).
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USOTONU_FACEBOOK_URL: ${{ secrets.USOTONU_FACEBOOK_URL }}
